<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120b0d" />
    <title>Encore — 专注中</title>
    <link rel="stylesheet" href="focus.css" />
    <link rel="stylesheet" href="focus-layout.css" />
  </head>
  <body>
    <main class="focus-page">
      <header>
        <span class="show-heading"><span class="brand" id="show-name">Encore</span><span class="act-label" id="act-label">· ACT I</span></span>
        <span class="header-actions"><button class="leave" id="leave-button" type="button" disabled>离开剧场 · 15:00</button><button class="pause" id="pause-button" type="button">暂停</button></span>
      </header>
      <section class="stage is-entering" id="stage">
        <div class="curtain curtain-left"></div><div class="curtain curtain-right"></div>
        <div class="focus-content"><strong id="timer">90:00</strong><span id="focus-detail">演出已经开始，请将注意力留在此刻</span></div>
        <div class="curtain-content"><p id="curtain-kicker">INTERMISSION</p><h1 id="curtain-title">中场休息</h1><strong id="curtain-timer">20:00</strong><span id="curtain-detail">稍后自动开始下半场</span><button id="curtain-action" type="button">提前回到座位</button></div>
      </section>
      <small class="absence-rule" id="absence-rule">离开剧场时将暂停计时；超过 5 分钟未返回，本场将作废。</small>
    </main>
    <script src="focus.js"></script>
  </body>
</html>
